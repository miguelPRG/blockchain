[project]
name = "blockchain-supply-chain"
version = "0.1.0"
description = "Hybrid blockchain supply chain API for craft beer traceability"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Supply Chain Team"}
]

dependencies = [
    "fastapi[standard]==0.136.1",
    "sqlalchemy==2.0.49",
    "pydantic-settings==2.14.1",
    "web3==7.16.0",
    "ecdsa==0.19.2",
    "rich==15.0.0",
]

[tool.uv]
# Configuração do UV
python-preference = "managed"

[tool.uv.sources]
# Fonte padrão é PyPI (não é necessário especificar)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
